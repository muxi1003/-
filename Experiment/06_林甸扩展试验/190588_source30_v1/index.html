$('csv-i').onclick=()=>csv('lindian190588_unobservable_intervals.csv',db.intervals,['window_id','annotation_round','start_seconds','end_seconds','reason','annotator']);
$('backup').onclick=()=>download('event_reference_L190588-P1_backup.json',JSON.stringify(db,null,2),'application/json');
$('restore').onchange=async()=>{try{const value=validateBackup(JSON.parse(await $('restore').files[0].text()));if(!confirm('用此备份替换当前浏览器内的标注？请先导出当前备份。'))return;db=value;save();list();load();msg('备份已导入。')}catch(e){msg(e.message)}};
function shortcutKey(event){
 if(event.ctrlKey||event.altKey||event.metaKey)return null;
 if(event.composedPath().some(node=>node instanceof Element&&(node.matches('input,textarea,select')||node.isContentEditable)))return null;
 // Windows IMEs can report key="Process" even outside editable controls.
 const physical={Space:' ',KeyQ:'q',KeyW:'w',KeyE:'e',KeyA:'a',KeyD:'d'};
 const key=physical[event.code]??(event.isComposing?'':(event.key||'').toLowerCase());
 return [' ','q','w','e','a','d'].includes(key)?key:null;
}
function stepVideo(direction){
 const select=$('window'), next=select.selectedIndex+direction;
 if(next<0||next>=select.options.length){msg(direction<0?'已经是第一个视频。':'已经是最后一个视频。');return;}
 select.selectedIndex=next;
 select.dispatchEvent(new Event('change',{bubbles:true}));
 msg('');
}
// Capture before native video/button controls so Space only toggles once.
document.addEventListener('keydown',event=>{
 const key=shortcutKey(event);
 if(key===null)return;
 event.preventDefault();
 event.stopImmediatePropagation();
 if(event.repeat)return;
 if(key===' '){
  const video=$('video');
  if(!video.readyState){msg('先加载对应视频。');return;}
  if(video.paused)video.play().catch(()=>msg('无法开始播放，请检查视频是否已加载。'));
  else video.pause();
 }else if(key==='q'||key==='w'){
  $('confidence').value=key==='q'?'confirmed':'uncertain';
  $('event').click();
 }else if(key==='e')$(begin===null?'begin':'end').click();
 else stepVideo(key==='a'?-1:1);
},true);
document.addEventListener('keyup',event=>{
 if(shortcutKey(event)!==' ')return;
 event.preventDefault();
 event.stopImmediatePropagation();
},true);
for(const [id,key,title] of [['video','Space','播放 / 暂停（空格）'],['event','Q W','记录呼气峰（Q确定 / W不确定）'],['begin','E','记录不可观察起点（E）'],['end','E','记录不可观察终点（E）'],['window','A D','切换视频（A上一个 / D下一个）']]){
 $(id).setAttribute('aria-keyshortcuts',key);
 $(id).title=title;
}
list();load();
</script></html>
