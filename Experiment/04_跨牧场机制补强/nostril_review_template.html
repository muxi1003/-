<script id="package" type="application/json">__PACKAGE_JSON__</script>
<script>
'use strict';
const pack=JSON.parse(document.getElementById('package').textContent);
const $=id=>document.getElementById(id), key='cow_rr_nostril_'+pack.package_id;
let records={},position=0,mode='A',scope='priority',drawing=null,undoStack=[],loaded=false;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved?.package_id===pack.package_id)records=saved.records||{};}catch(e){$('message').textContent='本地保存不可用，请及时导出JSON。';}
const img=new Image(),canvas=$('canvas'),ctx=canvas.getContext('2d');
function members(){return pack.frames.filter(f=>scope==='all'||(scope==='priority'?f.priority:records[f.frame_id]?.status!=='complete'));}
function current(){const list=members();position=Math.min(Math.max(position,0),Math.max(0,list.length-1));return list[position];}
function empty(){return {status:'pending',visibility:'pending',regions:{A:null,B:null},notes:'',annotator:''};}
function record(){const f=current();if(!f)return empty();return records[f.frame_id]||(records[f.frame_id]=empty());}
function persist(){try{localStorage.setItem(key,JSON.stringify({package_id:pack.package_id,records}));}catch(e){$('message').textContent='自动保存失败，请导出JSON。';}}
function checkpoint(){undoStack.push(JSON.stringify(record()));if(undoStack.length>30)undoStack.shift();}
function dirty(){record().status='pending';record().updated_at=new Date().toISOString();persist();renderMeta();}
function renderMeta(){const r=record(),f=current();$('saved').textContent=r.status==='complete'?'已完成':'待完成';$('shapeA').textContent=shapeText(r.regions.A);$('shapeB').textContent=shapeText(r.regions.B);$('progress').textContent=`${f?position+1:0} / ${members().length} · 已完成 ${Object.values(records).filter(x=>x.status==='complete').length}/72`;}
function shapeText(s){return s?`${s.cx.toFixed(1)}, ${s.cy.toFixed(1)} | ${s.rx.toFixed(1)} × ${s.ry.toFixed(1)}`:'未标记';}
function resize(){if(!loaded)return;const f=current(),v=$('viewport'),scale=Math.min(v.clientWidth/f.width,(v.clientHeight-4)/f.height)*Number($('zoom').value);canvas.style.width=f.width*scale+'px';canvas.style.height=f.height*scale+'px';$('canvaswrap').style.minWidth=f.width*scale+'px';draw();}
function ellipse(s,color){if(!s)return;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(s.cx,s.cy,s.rx,s.ry,0,0,2*Math.PI);ctx.stroke();ctx.beginPath();ctx.moveTo(s.cx-7,s.cy);ctx.lineTo(s.cx+7,s.cy);ctx.moveTo(s.cx,s.cy-7);ctx.lineTo(s.cx,s.cy+7);ctx.stroke();}
function draw(){if(!loaded)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);ellipse(record().regions.A,'#05cfdb');ellipse(record().regions.B,'#edbc35');if(drawing)ellipse(bounds(drawing.start,drawing.end),'#ffffff');}
function bounds(a,b){return {cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,rx:Math.abs(a.x-b.x)/2,ry:Math.abs(a.y-b.y)/2};}
function coordinates(e){const box=canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(canvas.width,(e.clientX-box.left)*canvas.width/box.width)),y:Math.max(0,Math.min(canvas.height,(e.clientY-box.top)*canvas.height/box.height))};}
function show(){loaded=false;drawing=null;undoStack=[];const f=current();$('prev').disabled=!f||position===0;$('next').disabled=!f||position>=members().length-1;$('done').disabled=!f;$('message').textContent='';if(!f){ctx.clearRect(0,0,canvas.width,canvas.height);$('frameid').textContent='当前集合已完成';renderMeta();return;}const r=record();$('frameid').textContent=f.frame_id;$('time').textContent=f.source_seconds.toFixed(3)+' s';$('size').textContent=f.width+' × '+f.height;$('visibility').value=r.visibility;$('notes').value=r.notes||'';$('annotator').value=r.annotator||'';canvas.width=f.width;canvas.height=f.height;renderMeta();img.onload=()=>{loaded=true;resize();};img.onerror=()=>{$('message').textContent='原始图片读取失败。请保留frames文件夹的位置。';};img.src=f.image;}
canvas.addEventListener('pointerdown',e=>{if(!loaded||e.button!==0)return;const p=coordinates(e);drawing={start:p,end:p};canvas.setPointerCapture(e.pointerId);draw();});
canvas.addEventListener('pointermove',e=>{if(drawing){drawing.end=coordinates(e);draw();}});
canvas.addEventListener('pointerup',e=>{if(!drawing)return;const shape=bounds(drawing.start,coordinates(e));drawing=null;if(shape.rx>=2&&shape.ry>=2){checkpoint();record().regions[mode]=shape;dirty();}draw();});
canvas.addEventListener('pointercancel',()=>{drawing=null;draw();});
function setMode(value){mode=value;for(const s of ['A','B'])$('mode'+s).classList.toggle('selected',s===mode);}
$('modeA').onclick=()=>setMode('A');$('modeB').onclick=()=>setMode('B');
$('clear').onclick=()=>{checkpoint();record().regions[mode]=null;dirty();draw();};
$('undo').onclick=()=>{if(!undoStack.length||!current())return;records[current().frame_id]=JSON.parse(undoStack.pop());persist();const r=record();$('visibility').value=r.visibility;$('notes').value=r.notes;$('annotator').value=r.annotator;renderMeta();draw();};
for(const field of ['visibility','notes','annotator'])$(field).addEventListener(field==='visibility'?'change':'input',()=>{checkpoint();record()[field]=$(field).value;dirty();});
function move(delta){if(!current())return;persist();position=Math.max(0,Math.min(members().length-1,position+delta));show();}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('zoom').oninput=resize;
$('scope').onchange=()=>{scope=$('scope').value;position=0;show();};
function validate(r){const n=Object.values(r.regions).filter(Boolean).length;if(r.visibility==='pending')return '请选择可见性。';if(r.visibility==='two_visible'&&n!==2)return '两侧可见时需标记A、B两个区域。';if(r.visibility==='one_visible'&&n!==1)return '仅一侧可见时需保留一个区域。';if(r.visibility==='not_visible'&&n!==0)return '不可辨认时请清除推测区域。';if(['not_visible','uncertain'].includes(r.visibility)&&!r.notes.trim())return '请记录不可辨认或不确定的原因。';if(!r.annotator.trim())return '请填写复核人。';return '';}
$('done').onclick=()=>{const r=record(),error=validate(r);if(error){$('message').textContent=error;return;}r.status='complete';r.updated_at=new Date().toISOString();persist();if(scope!=='pending')position=Math.min(position+1,members().length-1);show();};
$('export').onclick=()=>{persist();const blob=new Blob([JSON.stringify({schema_version:1,package_id:pack.package_id,exported_at:new Date().toISOString(),prediction_overlay_shown:false,records},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nostril_reference_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.package_id!==pack.package_id)throw Error('不是本批次标注');const ids=new Set(pack.frames.map(f=>f.frame_id));if(!data.records||Array.isArray(data.records))throw Error('记录格式错误');for(const [id,r] of Object.entries(data.records)){if(!ids.has(id)||!r.regions||!['pending','complete'].includes(r.status))throw Error('未知帧或损坏记录');for(const s of Object.values(r.regions)){if(s&&!['cx','cy','rx','ry'].every(k=>Number.isFinite(s[k])))throw Error('区域坐标无效');}}if(Object.keys(records).some(k=>records[k].status==='complete')&&!confirm('导入将替换当前本地记录。是否已导出备份并继续？'))return;records=data.records;persist();show();}catch(err){$('message').textContent='导入失败：'+err.message;}finally{e.target.value='';}};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.repeat||e.target?.closest?.('input,textarea,select,[contenteditable=true]'))return;const code=e.code;if(code==='KeyA'||code==='KeyD'){e.preventDefault();move(code==='KeyA'?-1:1);}if(code==='Digit1'||code==='Digit2'){e.preventDefault();setMode(code==='Digit1'?'A':'B');}});
window.addEventListener('resize',resize);show();
</script></html>
